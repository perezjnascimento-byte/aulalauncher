name: Build Aura Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate or Repair Android Project Structure
        id: proj
        run: |
          MANIFEST_IN_PLACE="$(find . -maxdepth 4 -path '*/app/src/main/AndroidManifest.xml' | head -n 1)"
          if [ -n "$MANIFEST_IN_PLACE" ]; then
            PROJECT_DIR="$(dirname "$(dirname "$(dirname "$(dirname "$MANIFEST_IN_PLACE")")")")"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAIN_KT="$(find . -maxdepth 4 -name 'MainActivity.kt' | head -n 1)"
          if [ -z "$MAIN_KT" ]; then
            echo "::error::MainActivity.kt nao encontrado no repositorio."
            ls -la
            exit 1
          fi

          FLAT_DIR="$(dirname "$MAIN_KT")"
          cd "$FLAT_DIR"
          mkdir -p app/src/main/java/com/aura/launcher app/src/main/res/values app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable gradle/wrapper

          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/aura/launcher/MainActivity.kt
          [ -f AuraNotificationListener.kt ] && mv AuraNotificationListener.kt app/src/main/java/com/aura/launcher/AuraNotificationListener.kt
          [ -f styles.xml ] && mv styles.xml app/src/main/res/values/styles.xml
          [ -f ic_launcher.xml ] && mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          [ -f ic_launcher_round.xml ] && mv ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          [ -f ic_launcher_background.xml ] && mv ic_launcher_background.xml app/src/main/res/drawable/ic_launcher_background.xml
          [ -f ic_launcher_foreground.xml ] && mv ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_foreground.xml
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties

          if [ -f build.gradle.kts ] && grep -q 'com.aura.launcher' build.gradle.kts; then
            mv build.gradle.kts app/build.gradle.kts
          fi

          if [ ! -f build.gradle.kts ]; then
            cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          fi

          if [ ! -f app/build.gradle.kts ]; then
            cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aura.launcher"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.aura.launcher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOF
          fi

          if [ ! -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml ] && grep -q 'ic_launcher' app/src/main/AndroidManifest.xml; then
            cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#15120F" />
          </shape>
          EOF
            cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:pathData="M54,30 A24,24 0 1,1 53.99,30 Z" android:strokeWidth="2.8" android:strokeColor="#E9A06B" android:strokeAlpha="0.85" />
          </vector>
          EOF
            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          if [ ! -f settings.gradle.kts ]; then
            cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AuraLauncher"
          include(":app")
          EOF
          fi

          if [ ! -f gradle.properties ]; then
            cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          fi

          echo "dir=$FLAT_DIR" >> "$GITHUB_OUTPUT"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
              "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
              "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle -p "${{ steps.proj.outputs.dir }}" assembleDebug --no-daemon
          cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Aura-Launcher-S26.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-S26-APK
          path: Aura-Launcher-S26.apk
