name: Build Aura Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Project Root
        id: proj
        run: |
          SETTINGS_FILE="$(find . -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Arquivo settings.gradle.kts nao encontrado no repositorio. Envie os arquivos descompactados do Aura-Android-Launcher-Source.zip."
            ls -la
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Android encontrado em: $PROJECT_DIR"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
              "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
              "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nao encontrado no runner."
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle -p "${{ steps.proj.outputs.dir }}" assembleDebug --no-daemon
          cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Aura-Launcher-S26.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-S26-APK
          path: Aura-Launcher-S26.apk
